global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'spring-boot-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.30.2.97:8081']
        labels:
          application: 'worker'
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.30.2.97:9100']