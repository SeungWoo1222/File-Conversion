global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.30.2.105:8081']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.30.2.105:15692']

  - job_name: 'node-exporter'
    static_configs:
      # 서버 자체 리소스(CPU/MEM) 모니터링을 위해 추가하는 것을 추천합니다.
      - targets: ['172.30.2.105:9100']