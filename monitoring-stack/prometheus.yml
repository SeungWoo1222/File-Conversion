global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    scheme: https
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api.fileconversion.site:8081']
        labels:
          application: 'worker'
  - job_name: 'node-exporter'
    scheme: https
    static_configs:
      - targets: ['api.fileconversion.site:9100']
  - job_name: 'consumer'
    scheme: https
    metrics_path: '/actuator/prometheus' # 경로 변경
    static_configs:
      - targets: ['api.fileconversion.site:8081']