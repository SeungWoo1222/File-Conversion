global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.30.2.200:8081']
        labels:
          application: 'worker'
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.30.2.200:9100']
  - job_name: 'consumer'
    metrics_path: '/actuator/prometheus' # 경로 변경
    static_configs:
      - targets: ['172.30.2.200:8081']