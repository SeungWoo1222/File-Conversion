version: '3.8'

services:
  worker-app:
    build:
      context: ..          # 스크린샷 구조상 상위 폴더의 common-core 등을 참조하기 위함
      dockerfile: worker-app/Dockerfile
    container_name: worker-app
    restart: always
    networks:
      - monitoring-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge