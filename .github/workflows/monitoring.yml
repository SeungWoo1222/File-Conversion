name: Monitoring Stack CD

on:
  push:
    paths:
      - 'monitoring-stack/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 파일 전송 (SCP)
      - name: Copy Configs to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ${{ secrets.MONITORING_USER }}
          key: ${{ secrets.MONITORING_KEY }}
          source: "monitoring-stack/*"
          target: "~/File-Conversion"

      # 스크립트 실행 (SSH)
      - name: Execute Deploy Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ${{ secrets.MONITORING_USER }}
          key: ${{ secrets.MONITORING_KEY }}
          script: |
            chmod +x ~/File-Conversion/monitoring-stack/deploy.sh
            ~/File-Conversion/monitoring-stack/deploy.sh