name: cd
# test 02
on:
  push:
    branches: ["dev/v2"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "188615717003"
  API_EC2_INSTANCE_ID: "i-04d273add12b3752e"
  WORKER_EC2_INSTANCE_ID: "i-0cab3bc3dafa0aa12"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188615717003:role/Role-GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          set -euo pipefail

          TAG="$(TZ=Asia/Seoul date +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "TAG=$TAG"

      - name: Build & Push API Docker image
        id: build_api
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/toyboyz-api"

          echo "API_ECR_URI=$ECR_URI"
          echo "TAG=$TAG"

          docker buildx build \
            --platform linux/amd64 \
            -f api-app/Dockerfile \
            -t "${ECR_URI}:${TAG}" \
            --push \
            .

      - name: Deploy API on EC2 via SSM Run Command
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          echo "Deploy API tag: $TAG"

          CMD_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${API_EC2_INSTANCE_ID}" \
            --parameters "{\"commands\":[\"sudo -u ssm-user -H bash /home/ssm-user/deploy/deploy.sh ${TAG}\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "API SSM CommandId: $CMD_ID"

          WAIT_EXIT=0
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "$CMD_ID" \
            --instance-id "${API_EC2_INSTANCE_ID}" || WAIT_EXIT=$?

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "$CMD_ID" \
            --instance-id "${API_EC2_INSTANCE_ID}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}"

          if [ "$WAIT_EXIT" -ne 0 ]; then
            exit "$WAIT_EXIT"
          fi

      - name: Build & Push Worker Docker image
        id: build_worker
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/toyboyz-worker"

          echo "WORKER_ECR_URI=$ECR_URI"
          echo "TAG=$TAG"

          docker buildx build \
            --platform linux/amd64 \
            -f worker-app/Dockerfile \
            -t "${ECR_URI}:${TAG}" \
            --push \
            .

      - name: Deploy Worker on EC2 via SSM Run Command
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          echo "Deploy Worker tag: $TAG"

          CMD_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${WORKER_EC2_INSTANCE_ID}" \
            --parameters "{\"commands\":[\"set -euo pipefail\",\"echo '=== Disk before cleanup ==='\",\"df -h\",\"echo '=== Docker usage before cleanup ==='\",\"docker system df || true\",\"echo '=== Prune stopped containers ==='\",\"docker container prune -f || true\",\"echo '=== Prune unused images ==='\",\"docker image prune -af || true\",\"echo '=== Prune build cache ==='\",\"docker builder prune -af || true\",\"echo '=== Disk after cleanup ==='\",\"df -h\",\"echo '=== Docker usage after cleanup ==='\",\"docker system df || true\",\"sudo -u ssm-user -H bash /home/ssm-user/deploy-worker-cdc/deploy-worker.sh ${TAG}\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Worker SSM CommandId: $CMD_ID"

          WAIT_EXIT=0
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "$CMD_ID" \
            --instance-id "${WORKER_EC2_INSTANCE_ID}" || WAIT_EXIT=$?

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "$CMD_ID" \
            --instance-id "${WORKER_EC2_INSTANCE_ID}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}"

          if [ "$WAIT_EXIT" -ne 0 ]; then
            exit "$WAIT_EXIT"
          fi
