<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dark File Converter - Image Only</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center g-4 main-layout">

        <div class="col-lg-8 left-panel">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold bright-title">Image Converter</h2>
                    <p class="text-secondary small">이미지 파일을 선택하여 PDF로 변환하세요</p>
                </div>

                <form id="uploadForm">
                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold" style="color:#a5b4fc">파일 업로드</label>
                        <input class="form-control" type="file" id="fileInput" name="files" multiple
                               accept=".png,.jpg,.jpeg,.gif,.bmp" required>
                        <div class="helper-text">
                            지원 포맷: PNG, JPG, GIF, BMP / 파일당 최대 20MB / 최대 3개
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold" style="color:#a5b4fc">선택된 파일 목록</label>
                        <div class="file-list-container p-2">
                            <ul id="fileList" class="list-group list-group-flush"></ul>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold" style="color:#a5b4fc">변환 포맷</label>
                        <select class="form-select" name="targetFormat" required>
                            <option value="PDF" selected>PDF</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" id="submitBtn" class="btn btn-neon">변환 시작</button>
                    </div>
                </form>
            </div>

            <div class="card p-4">
                <h5 class="fw-bold mb-3" style="color:#a5b4fc">실시간 변환 상태</h5>
                <div class="table-responsive table-dark-custom">
                    <table class="table mb-0" style="table-layout: fixed; width: 100%;">
                        <thead style="background: rgba(255,255,255,0.05)">
                        <tr>
                            <th style="width: 40%; padding-left: 24px;">파일명</th>
                            <th class="text-center" style="width: 15%">상태</th>
                            <th class="text-center" style="width: 25%">진행률</th>
                            <th class="text-end" style="width: 20%; padding-right: 24px;">다운로드</th>
                        </tr>
                        </thead>
                        <tbody id="status-tbody">
                        <tr th:each="history : ${histories}" class="history-row" th:data-s3-filename="${history.s3FileName}">
                            <td th:text="${history.originalFile}" class="text-truncate" style="padding-left: 24px;">파일명</td>
                            <td class="status-cell text-center">
                                <span class="badge" th:classappend="${history.status == '3' ? 'bg-success' : (history.status == '2' ? 'bg-primary' : 'bg-secondary')}"
                                      th:text="${history.status == '3' ? '완료' : (history.status == '2' ? '진행 중' : '대기 중')}">대기 중</span>
                            </td>
                            <td class="progress-cell" style="vertical-align: middle;">
                                <div class="progress" style="height: 8px; background: rgba(255,255,255,0.1);">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                                         role="progressbar" th:style="'width: ' + ${history.percent ?: 0} + '%'"></div>
                                </div>
                                <small class="percent-text d-block text-center mt-1" style="font-size: 0.7rem;"
                                       th:text="${(history.percent ?: 0) + '%'}">0%</small>
                            </td>
                            <td class="message-cell small text-end" style="padding-right: 24px;">
                                <th:block th:if="${history.status == '3' and history.convertedFile != null and !history.convertedFile.trim().isEmpty()}">
                                    <span class="download-link" th:onclick="window.handleDownloadRequest([[${history.convertedFile}]])"
                                          style="color: #a5b4fc; cursor: pointer; text-decoration: underline; font-weight: bold;">
                                        파일 다운로드
                                    </span>
                                </th:block>
                                <th:block th:unless="${history.status == '3'}">
                                    <span class="text-secondary" th:text="${history.message ?: '-'}">-</span>
                                </th:block>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(histories)}" id="empty-row">
                            <td colspan="4" class="text-center text-muted p-4">변환 내역이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4 right-panel">
            <div class="card p-4 stats-sidebar">
                <div class="stats-title">실시간 파일 변환 현황</div>
                <div class="stats-box">
                    <div class="stats-label">전체 누적 변환 건수</div>
                    <div id="globalCompletedCount" class="stats-value">0</div>
                    <div class="stats-subtext">서버 전체 누적 변환 수입니다.</div>
                </div>
                <div class="stats-box mb-0">
                    <div class="stats-label">전체 누적 변환 용량</div>
                    <div id="globalCompletedBytes" class="stats-value">0 B</div>
                    <div class="stats-subtext">서버에서 처리한 총 용량입니다.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/converter.js}"></script>
</body>
</html>
