<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>변환 이력 및 실시간 상태</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .status-3 { color: #198754; font-weight: bold; } /* 완료 상태 스타일 */
        .history-row { transition: background-color 0.5s; }
        .update-highlight { background-color: #fff3cd; } /* 업데이트 시 반짝임 효과 */
    </style>
</head>
<body class="p-5">
<h1 class="mb-4">File Conversion History</h1>

<div class="mb-4">
    <input type="file" id="fileInput" multiple class="form-control mb-2">
    <button type="button" onclick="requestConversion()" class="btn btn-primary">변환 요청</button>
</div>

<div class="card shadow">
    <div class="card-body">
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>파일명</th>
                <th>상태</th>
                <th>메시지</th>
                <th>생성일</th>
            </tr>
            </thead>
            <tbody id="history-tbody">
            <tr th:each="history, iterStat : ${histories}"
                class="history-row"
                th:data-id="${history.historyId}">
                <td th:text="${iterStat.count}">1</td>
                <td th:text="${history.originalFile}">filename.zip</td>
                <td class="status-cell">
                    <span class="badge"
                          th:classappend="${history.status == '3' ? 'bg-success' : 'bg-secondary'}"
                          th:text="${history.status}">1</span>
                </td>
                <td class="message-cell">-</td>
                <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-02-01</td>
            </tr>

            <tr th:if="${#lists.isEmpty(histories)}" id="empty-row">
                <td colspan="5" class="text-center text-muted p-5">변환 이력이 아직 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>





<script th:inline="javascript">

    function getOrCreateUuid() {
    // sessionStorage 대신 localStorage를 사용합니다.
    let uuid = localStorage.getItem('uuid');
    if (!uuid) {
        uuid = crypto.randomUUID();
        localStorage.setItem('uuid', uuid);
    }
    return uuid;
}


    /*<![CDATA[*/
    // 서버에서 전달받은 UUID (없을 경우를 대비해 기본값 설정)
    const userUuid = /*[[${uuid}]]*/ 'default-uuid';
    /*]]>*/

    // 페이지 로드 시 SSE 연결 시작
    document.addEventListener('DOMContentLoaded', () => {
        if (userUuid && userUuid !== 'default-uuid') {
            startSseConnection(userUuid);
        } else {
            console.error("UUID가 존재하지 않아 SSE를 연결할 수 없습니다.");
        }
    });

    // 1. SSE 연결 함수
    function startSseConnection(uuid) {
        const eventSource = new EventSource(`/api/sse/connect/${uuid}`);

        // 서버의 .name("history-update")와 매칭
        eventSource.addEventListener('history-update', (event) => {
            const data = JSON.parse(event.data);
            console.log("실시간 업데이트 수신:", data);
            updateTableRow(data);
        });

        // 연결 확인용 더미 이벤트 (서버에서 .name("connect")로 보낼 때)
        eventSource.addEventListener('connect', (event) => {
            console.log("SSE Connected:", event.data);
        });

        eventSource.onerror = (error) => {
            console.error("SSE 연결 오류 발생. 재연결을 시도합니다.");
            // 에러 발생 시 연결을 닫으면 브라우저가 자동으로 재연결을 시도함
        };
    }

    // 2. DOM 업데이트 함수 (새로고침 없이 상태 변경)
    function updateTableRow(data) {
        // th:data-id로 설정한 tr 요소를 찾음
        const row = document.querySelector(`tr[data-id="${data.id}"]`);

        if (row) {
            const statusCell = row.querySelector('.status-cell');
            const messageCell = row.querySelector('.message-cell');

            // 상태 뱃지 업데이트
            let badgeClass = 'bg-secondary';
            if (data.status === '2') badgeClass = 'bg-primary';
            if (data.status === '3') badgeClass = 'bg-success';

            statusCell.innerHTML = `<span class="badge ${badgeClass}">${data.status}</span>`;
            messageCell.innerText = data.message;

            // 시각적 피드백 (반짝임 효과)
            row.classList.add('update-highlight');
            setTimeout(() => row.classList.remove('update-highlight'), 1000);

            if (data.status === "3") {
                console.log(`ID ${data.id}: 변환 완료!`);
            }
        }
    }

    // 3. 변환 요청 함수 (예시)
    function requestConversion() {
        // 실제 파일 업로드 fetch 로직이 들어갈 자리입니다.
        // 성공 후 addNewRowToTable()을 호출하여 화면에 미리 행을 추가할 수 있습니다.
        alert("파일 업로드 로직을 구현하세요.");
    }
</script>
</body>
</html>
