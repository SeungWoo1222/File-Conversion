<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dark File Converter - Convert & Status</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0, transparent 50%),
                              radial-gradient(at 50% 0%, rgba(76, 29, 149, 0.4) 0, transparent 50%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            padding: 50px 0;
        }
        .bright-title {
            background: linear-gradient(to right, #ffffff, #a5b4fc, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(129, 140, 248, 0.4);
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }
        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
        }
        .btn-neon {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: white;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .file-list-container {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
        /* 상태 테이블 스타일 */
        .table { color: #cbd5e1; }
        .table-dark-custom { background: rgba(15, 23, 42, 0.4); border-radius: 15px; overflow: hidden; }
        .update-highlight { animation: flash 2s; }
        @keyframes flash {
            0% { background-color: rgba(99, 102, 241, 0.3); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold bright-title">File Converter</h2>
                    <p class="text-secondary small">변환 요청 후 하단에서 실시간 상태를 확인하세요</p>
                </div>

                <form id="uploadForm">
                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold" style="color:#a5b4fc">파일 업로드</label>
                        <input class="form-control" type="file" id="fileInput" name="files" multiple onchange="updateFileList()" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold" style="color:#a5b4fc">선택된 파일 목록</label>
                        <div class="file-list-container p-2">
                            <ul id="fileList" class="list-group list-group-flush">
                                <li class="list-group-item text-muted text-center border-0" style="background:transparent">파일을 선택하세요</li>
                            </ul>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold text-indigo-300">변환 포맷</label>
                        <select class="form-select" name="targetFormat" required>
                            <option value="" disabled selected>포맷 선택</option>
                            <option th:each="format : ${formats}" th:value="${format}" th:text="${format}">PDF</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" id="submitBtn" class="btn btn-neon">변환 시작</button>
                    </div>
                </form>
            </div>

            <div class="card p-4">
                <h5 class="fw-bold mb-3" style="color:#a5b4fc">실시간 변환 상태</h5>
                <div class="table-responsive table-dark-custom">
                    <table class="table mb-0" style="table-layout: fixed; width: 100%;">
                        <thead style="background: rgba(255,255,255,0.05)">
                        <tr>
                            <th style="width: 35%">파일명</th>
                            <th class="text-center" style="width: 15%">상태</th>
                            <th class="text-center" style="width: 25%">진행률</th>
                            <th style="width: 25%">메시지</th>
                        </tr>
                        </thead>
                        <tbody id="status-tbody">
                        <tr th:each="history : ${histories}"
                            class="history-row"
                            th:data-id="${history.historyId}"
                            th:data-filename="${history.uuid}">

                            <td th:text="${history.originalFile}" class="text-truncate">파일명</td>

                            <td class="status-cell text-center">
                                    <span class="badge"
                                          th:classappend="${history.status == '3' ? 'bg-success' : (history.status == '2' ? 'bg-primary' : 'bg-secondary')}"
                                          th:text="${history.status == '3' ? '완료' : (history.status == '2' ? '진행 중' : '대기 중')}">대기 중</span>
                            </td>

                            <td class="progress-cell" style="vertical-align: middle;">
                                <div class="progress" style="height: 8px; background: rgba(255,255,255,0.1);">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                                         role="progressbar"
                                         th:style="'width: ' + ${history.percent ?: 0} + '%'"></div>
                                </div>
                                <small class="percent-text d-block text-center mt-1" style="font-size: 0.7rem;"
                                       th:text="${(history.percent ?: 0) + '%'}">0%</small>
                            </td>

                            <td class="message-cell small text-secondary" th:text="${history.message ?: '-'}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(histories)}" id="empty-row">
                            <td colspan="4" class="text-center text-muted p-4">변환 내역이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    // 1. UUID 관리 (localStorage로 고정)
    function getOrCreateUuid() {
        let uuid = localStorage.getItem('uuid');
        if (!uuid) {
            uuid = crypto.randomUUID();
            localStorage.setItem('uuid', uuid);
        }
        return uuid;
    }
    const myUuid = getOrCreateUuid();

    // 2. SSE 연결 및 데이터 수신
    function initSse(uuid) {
        console.log("📍 SSE 연결 중... UUID:", uuid);
        const eventSource = new EventSource(`/api/sse/connect/${uuid}`);

        eventSource.addEventListener('redis-caching-update', (event) => {
            const data = JSON.parse(event.data);
            console.log("🔔 상태 업데이트 수신:", data);
            updateStatusUI(data);
        });

        eventSource.onopen = () => console.log("✅ SSE 연결 성공");
        eventSource.onerror = () => eventSource.close();
    }

    // 초기 실행
    initSse(myUuid);

    // 3. 수신한 데이터를 기반으로 테이블의 특정 행을 찾아 변경 (유일한 단일 함수)
    function updateStatusUI(data) {
        // [중요] 내 세션 UUID가 아닌 경우 무시 (다른 사람의 알림 간섭 방지)
        if (data.uuid !== myUuid) {
            return;
        }

        // 서버의 파일 식별자(filename)를 기준으로 정확한 행 찾기
        const row = document.querySelector(`tr[data-filename="${data.filename}"]`);

        if (row) {
            console.log("✅ 매칭 성공:", data.filename);

            const statusCell = row.querySelector('.status-cell');
            const progressBar = row.querySelector('.progress-bar');
            const percentText = row.querySelector('.percent-text');
            const messageCell = row.querySelector('.message-cell');

            // 상태값 숫자("1", "2", "3") 또는 문자열에 따른 처리
            let statusText = "대기 중";
            let badgeClass = "bg-secondary";

            if (data.status === "2" || (typeof data.status === 'string' && data.status.includes("업데이트"))) {
                statusText = "진행 중";
                badgeClass = "bg-primary";
            } else if (data.status === "3" || (typeof data.status === 'string' && data.status.includes("완료"))) {
                statusText = "완료";
                badgeClass = "bg-success";
            }

            if (statusCell) {
                statusCell.innerHTML = `<span class="badge ${badgeClass}">${statusText}</span>`;
            }

            // 진행률(percent) 실시간 반영
            if (progressBar && data.percent !== undefined) {
                const p = data.percent;
                progressBar.style.setProperty('width', p + '%', 'important');

                if (percentText) {
                    percentText.innerText = p + "%";
                }

                if (p >= 100 || statusText === "완료") {
                    progressBar.classList.remove('progress-bar-animated');
                    progressBar.classList.replace('bg-info', 'bg-success'); // 완료 시 초록색으로 변경
                }
            }

            // 메시지 업데이트
            if (messageCell && statusText === "완료") {
                messageCell.innerText = "변환 완료";
            } else if (messageCell) {
                messageCell.innerText = data.status === "2" ? "처리 중..." : "-";
            }

            row.classList.add('update-highlight');
            setTimeout(() => row.classList.remove('update-highlight'), 1000);
        } else {
            console.warn("❌ 매칭 실패: 화면에 해당 파일명 식별자를 가진 행이 없습니다 ->", data.filename);
        }
    }

    // 4. 파일 업로드 목록 업데이트 UI
    function updateFileList() {
        const input = document.getElementById('fileInput');
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        if (input.files.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center border-0" style="background:transparent">파일을 선택하세요</li>';
            return;
        }
        Array.from(input.files).forEach(f => {
            const li = document.createElement('li');
            li.className = 'list-group-item text-white border-0 py-2';
            li.style.background = 'transparent';
            li.innerText = f.name;
            list.appendChild(li);
        });
    }

    // 5. 업로드 + 완료 처리 (Presigned URL 방식)
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('fileInput');
        const files = Array.from(fileInput.files);
        const targetFormat = document.querySelector('select[name="targetFormat"]').value;

        if (files.length === 0 || !targetFormat) return;

        btn.disabled = true;
        btn.innerText = "URL 발급 중...";

        try {
            // 1) upload-init
            const initReq = {
                uuid: myUuid,
                targetFormat: targetFormat,
                files: files.map(f => ({
                    filename: f.name,
                    contentType: f.type || "application/octet-stream",
                    size: f.size
                }))
            };

            const initRes = await fetch('/file/upload-init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(initReq)
            });

            if (!initRes.ok) throw new Error("upload-init 실패");
            const initData = await initRes.json();

            // 2) S3 PUT 업로드
            btn.innerText = "S3 업로드 중...";
            for (let i = 0; i < initData.items.length; i++) {
                const item = initData.items[i];
                const f = files[i];

                const putRes = await fetch(item.uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': f.type || "application/octet-stream" },
                    body: f
                });

                if (!putRes.ok) throw new Error(`S3 업로드 실패: ${f.name}`);
            }

            // 3) upload-complete
            btn.innerText = "서버 처리 중...";

            const completeRes = await fetch('/file/upload-complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uuid: myUuid,
                    historyIds: initData.items.map(x => x.historyId)
                })
            });

            if (!completeRes.ok) throw new Error("upload-complete 실패");

            const text = await completeRes.text();
            if (!text) {
                location.reload();
                return;
            }
            const newHistories = JSON.parse(text);

            const emptyRow = document.getElementById('empty-row');
            if (emptyRow) emptyRow.remove();

            const tbody = document.getElementById('status-tbody');

            newHistories.forEach(history => {
                const row = document.createElement('tr');
                row.className = 'history-row update-highlight';
                row.setAttribute('data-id', history.historyId);
                // 중요: 새로 추가된 행도 매칭될 수 있도록 data-filename 속성을 심어줌
                row.setAttribute('data-filename', history.uuid);

                let statusText = "대기 중";
                let badgeClass = "bg-secondary";

                if (history.status == '2') {
                    statusText = "진행 중";
                    badgeClass = "bg-primary";
                } else if (history.status == '3') {
                    statusText = "완료";
                    badgeClass = "bg-success";
                }

                row.innerHTML = `
                    <td class="text-truncate" style="max-width: 150px;">${history.fileName || history.originalFile}</td>
                    <td class="status-cell text-center">
                        <span class="badge ${badgeClass}">${statusText}</span>
                    </td>
                    <td class="progress-cell" style="vertical-align: middle;">
                        <div class="progress" style="height: 8px; background: rgba(255,255,255,0.1);">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                                 role="progressbar" style="width: 0%"></div>
                        </div>
                        <small class="percent-text d-block text-center mt-1" style="font-size: 0.7rem;">0%</small>
                    </td>
                    <td class="message-cell small text-secondary">${history.message || '-'}</td>
                `;
                tbody.prepend(row);
            });

            this.reset();
            document.getElementById('fileList').innerHTML =
                '<li class="list-group-item text-muted text-center border-0" style="background:transparent">파일을 선택하세요</li>';

            btn.disabled = false;
            btn.innerText = "변환 시작";

        } catch (err) {
            console.error("❌ 업로드 실패:", err);
            btn.disabled = false;
            btn.innerText = "변환 시작";
            alert("업로드 처리 중 오류가 발생했습니다.");
        }
    });

</script>
</body>
</html>
