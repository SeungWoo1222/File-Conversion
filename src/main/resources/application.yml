spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://file-conversion-database-1.cn6kiey0qu1a.ap-northeast-2.rds.amazonaws.com:3306/api?useSSL-false&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:toyboyz}
    password: ${SPRING_DATASOURCE_PASSWORD:toytoy123}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      use-new-id-generator-mappings: false
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true

app:
  s3:
    bucket: toyboyz-fileconv-bucket
    region: ap-northeast-2
    prefix: uploads
    presign-ttl-seconds: 900   # 15분
